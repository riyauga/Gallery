<html lang="zh-CN"><head><meta charset="utf-8">

<style>

#tweak{position:absolute;right:8px;bottom:8px;z-index:30;font-size:12px;opacity:0;transition:opacity .16s}#tweak:hover,#tweak:focus-within,#tweak[open]{opacity:1}#tweak summary{cursor:pointer;list-style:none;text-align:right;padding:6px 9px;border:1px solid var(--g-line);border-radius:6px;background:var(--g-panel)}#tweak .controls{position:absolute;bottom:42px;right:0;width:255px;max-height:70vh;overflow:auto;padding:14px;border:1px solid var(--g-line);border-radius:9px;background:var(--g-panel);box-shadow:0 8px 24px #0004}#tweak label{display:block;margin-bottom:12px}#tweak output{float:right;font-variant-numeric:tabular-nums}#tweak input[type=range]{display:block;width:100%;accent-color:var(--g-accent)}#tweak fieldset{margin:0 0 12px;padding:0;border:0}#tweak legend{margin-bottom:6px;opacity:.75}#tweak fieldset label{display:flex;align-items:center;gap:6px;margin:0 0 4px}#tweak input[type=radio]{accent-color:var(--g-accent)}#tweak button{font-size:12px;padding:5px 10px}

.batch #deck .g-selected .g-check::after{content:'✓';font-weight:700}

<script>

   for(const item of pair){

const frameProperties=['paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderTopColor','borderRightColor','borderBottomColor','borderLeftColor','borderRadius','boxShadow'];

function finishDeal(){
 dealSerial++;
 if(dealFrame){cancelAnimationFrame(dealFrame);dealFrame=0;}
 for(const animation of dealAnimations)animation.cancel();dealAnimations=[];dealCards.clear();
 if(dealLayer){dealLayer.remove();dealLayer=null;}

 for(const {element}of cards.values())element.querySelector('.g-deal-art')?.remove();

function startDeal(snapshot){
 if(!snapshot||!cards.size)return;

 const serial=dealSerial,box=snapshot.box,layer=document.createElement('div');layer.id='deal-layer';

 // 保留原圆环，等布局连续两帧稳定、宿主补齐整个窗口后再发牌。

function beginMotion(){
