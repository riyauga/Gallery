<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery 设置</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="basecoat-vega.min.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="options">
  <aside>
    <div class="settings-brand"><img src="icons/icon32.png" alt="" width="28" height="28"><h1>Gallery</h1></div>
    <nav aria-label="设置分类">
      <button class="btn nav-button" data-variant="ghost" data-page="capture" aria-current="page">常规</button>
      <button class="btn nav-button" data-variant="ghost" data-page="sites">接收网站</button>
      <button class="btn nav-button" data-variant="ghost" data-page="connection">桌面连接</button>
    </nav>
  </aside>
  <main>
    <p id="loading" role="status">正在读取设置…</p>
    <section id="capture" hidden>
      <h2>常规</h2>
      <div class="card settings-group">
        <label class="setting-row"><span>接收普通图片下载</span><input id="enabled" type="checkbox" role="switch" class="input"></label>
        <label class="setting-row">
          <span>接收所有网站的图片下载<small class="muted" id="all-sites-help">关闭时，仅接收匹配站点的下载。</small></span>
          <input id="captureAllImages" type="checkbox" role="switch" class="input" aria-describedby="all-sites-help">
        </label>
      </div>
      <div class="card settings-group">
        <label class="setting-row"><span>启用网页拖拽收图</span><input id="dragEnabled" type="checkbox" role="switch" class="input"></label>
        <details>
          <summary>拖拽选项</summary>
          <div class="disclosure-panel">
            <div class="details-content">
              <label class="field">黑洞停靠位置<select class="select" id="dropZoneCorner"><option value="right-center">右侧居中</option><option value="right-top">右上角</option><option value="right-bottom">右下角</option><option value="left-bottom">左下角</option></select></label>
              <form id="drag-directory" class="settings-form">
                <label class="field">下载子目录<input class="input" id="dragTargetDir" placeholder="留空会直接保存到浏览器下载目录"></label>
                <button class="btn" data-variant="outline" type="submit">保存子目录</button>
              </form>
            </div>
          </div>
        </details>
      </div>
      <label class="card settings-group setting-row">外观<select class="select" id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <p class="feedback" id="capture-feedback" role="status"></p>
    </section>
    <section id="sites" hidden>
      <div class="sites-heading"><h2>接收网站</h2><button id="new-site" class="btn" type="button">＋ 添加网站</button></div>
      <div id="new-site-editor"></div>
      <div id="site-list" class="sites-list"></div>
      <p class="feedback" id="sites-feedback" role="status"></p>
    </section>
    <section id="connection" hidden>
      <h2>桌面连接</h2>
      <div class="card settings-group setting-row">
        <div><p id="bridge-status" role="status">正在检查连接…</p><p id="bridge-queue" class="muted" hidden></p></div>
        <button class="btn" data-variant="outline" id="retry-queue" type="button" hidden>重新推送</button>
      </div>
      <form id="bridge-form" class="card settings-group settings-form connection-form">
        <label class="field">连接配置或配对码<input class="input" id="bridgeToken" type="password" autocomplete="off" aria-describedby="bridge-help"></label>
        <p class="muted" id="bridge-help">从 Gallery 桌面端「设置 → 浏览器插件」复制连接配置。</p>
        <div class="row">
          <button class="btn" type="submit">保存连接设置</button>
          <button class="btn" data-variant="outline" id="test-bridge" type="button">测试连接</button>
        </div>
        <details>
          <summary>高级连接设置</summary>
          <div class="disclosure-panel">
            <div class="details-content">
              <label class="field">本地端口<input class="input" id="bridgePort" type="number" min="1024" max="65535" required></label>
            </div>
          </div>
        </details>
      </form>
      <p id="bridge-feedback" class="feedback" role="status"></p>
    </section>
  </main>
</div>
<script type="module" src="options.js"></script>
  <script src="text-selection.js"></script>
</body>
</html>
