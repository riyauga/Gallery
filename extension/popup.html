<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery</title><link rel="icon" type="image/png" href="icons/icon32.png"><link rel="stylesheet" href="ui.css"></head><body class="popup">
<h1>Gallery</h1><p class="muted">保存图片，随后按标签找到它。</p>
<div class="status"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7V4h6l3 3h9v13H3V7Z"/></svg><div><strong id="site-title">正在检查网站…</strong><span class="muted" id="site-detail">读取接收规则</span></div></div>
<div class="status"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="3"/><path d="M8 21h8m-4-4v4"/></svg><div><strong id="connection-title">正在连接桌面端…</strong><span class="muted" id="connection-detail">检查连接状态</span></div></div>
<div class="status"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16l2 12v4H2v-4L4 4Z"/><path d="M2 16h6l2 3h4l2-3h6"/></svg><div><strong id="pending-title">正在检查队列…</strong><span class="muted" id="pending-detail">标签逐条持久保存</span></div></div>
<div class="status"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v3h16v-3"/></svg><div><strong id="source-title">来源补全未运行</strong><span class="muted" id="source-detail">按文件名里的 danbooru md5 反查帖子</span></div></div>
<div class="actions"><button class="primary grow" id="open-gallery">打开图库</button></div>
<div class="actions"><button class="grow" id="open-pending">待处理</button><button class="grow" id="backfill-sources">补全图片来源</button></div>
<div class="actions links"><button class="link" id="settings">设置</button><button class="link" id="retry">重试连接</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div>
<script type="module" src="popup.js"></script></body></html>
