<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Gallery</title>
  <link rel="stylesheet" href="basecoat-vega.min.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="popup-header">
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Gallery</h1>
    <button class="btn" data-variant="ghost" id="settings">设置</button>
  </header>
  <main>
    <div class="card popup-status" role="status">
      <div id="connection">正在检查连接…</div>
      <div class="muted" id="queued" hidden></div>
      <div class="muted popup-error" id="queue-error" hidden></div>
    </div>
    <div class="popup-actions">
      <button class="btn" id="library">打开图库</button>
    </div>
    <div class="feedback" id="feedback" role="status" hidden></div>
  </main>
  <script type="module" src="popup.js"></script>
  <script src="text-selection.js"></script>
</body>
</html>
